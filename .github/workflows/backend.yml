name: Arhilab 0.7.0 Backend
on:
  push:
    branches: [arhilab-0.7.0-architecture]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arhilab
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: arhilab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arhilab -d arhilab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arhilab:local-ci-only@localhost:5432/arhilab_test
      NODE_ENV: test
      LOGIN_RATE_LIMIT_MAX: 100
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run migrate:test
      - name: Start local S3-compatible storage
        run: |
          docker run -d --name arhilab-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=local-ci-only -e MINIO_ROOT_PASSWORD=local-ci-only-password \
            minio/minio:RELEASE.2024-11-07T00-52-20Z server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          docker logs arhilab-ci-minio
          exit 1
      - name: Stage 2 and Stage 3 PostgreSQL integration tests
        env:
          STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: npm run test:integration
      - run: npm run build
      - run: docker build -t arhilab-backend:test .
      - name: Compose health smoke test
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health && curl -fsS http://localhost:3000/api/v1/health/storage; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify production bootstrap command
        run: docker compose exec -T api test -f /app/dist/bootstrap.js
      - name: Compose bootstrap and sync smoke test
        run: |
          org="$(docker compose exec -T -e BOOTSTRAP_ORGANIZATION_NAME='CI smoke org' -e BOOTSTRAP_ADMIN_EMAIL=ci-smoke@test.example -e BOOTSTRAP_ADMIN_PASSWORD='local-ci-only-password-123' api node dist/bootstrap.js | sed -n 's/^Organization initialized: //p')"
          test -n "$org"
          COMPOSE_SMOKE_ORG="$org" COMPOSE_SMOKE_PASSWORD='local-ci-only-password-123' node --import tsx scripts/smoke-compose.ts
      - if: always()
        run: |
          docker compose down -v
          docker rm -f arhilab-ci-minio || true
