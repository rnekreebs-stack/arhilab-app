name: Arhilab Смета 0.8.0 alpha6 Android
on:
  workflow_dispatch:
  push:
    branches: [main, master, arhilab-0.8.0-ui-local]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Restore browser test dependencies
        run: |
          npm install --prefix .ci-deps --no-audit --no-fund playwright@1.51.1
          .ci-deps/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=$GITHUB_WORKSPACE/.ci-deps/node_modules" >> "$GITHUB_ENV"
      - name: Prepare bundled offline Russian OCR
        run: |
          bash arhilab/prepare-ocr.sh
          echo "ARHILAB_OCR_DIR=$GITHUB_WORKSPACE/.ci-ocr" >> "$GITHUB_ENV"
      - name: Existing tests
        run: bash arhilab/tests/run.sh
      - name: Compile application sources
        run: |
          mkdir -p "$RUNNER_TEMP/arhilab-classes"
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_SDK_ROOT/platforms/android-35/android.jar:$GITHUB_WORKSPACE/.ci-ocr/classes.jar" -d "$RUNNER_TEMP/arhilab-classes" arhilab/src/ru/arhilab/estimate/*.java
      - name: Restore permanent Debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ARHILAB_DEBUG_KEYSTORE_BASE64 }}
        run: |
          : "${DEBUG_KEYSTORE_BASE64:?Configure ARHILAB_DEBUG_KEYSTORE_BASE64 before a build}"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arhilab-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/arhilab-debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Build and verify Debug APK
        id: debug
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          export SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore"
          bash arhilab/build.sh debug
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' output/*debug.apk.signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' output/*debug.apk.signature.txt
          grep -qi '490b0b6e11a9090b63c56430c243e362a6fa7fcc165dfee38372767ac430728f' output/*debug.apk.signature.txt
      - name: Build 0.6.2 upgrade baseline with the same permanent Debug key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          git worktree add --detach "$RUNNER_TEMP/arhilab-baseline" b0ca0374545bce7541f9c1dd5c25bee18a119f70
          export SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore"
          bash "$RUNNER_TEMP/arhilab-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-baseline/output/Arhilab-Смета-0.6.2-debug.apk" output/upgrade-baseline-0.6.2-debug.apk
          git worktree add --detach "$RUNNER_TEMP/arhilab-f6-baseline" e877f8efd84a2c887d83a074bbce1f6e28c6c75b
          bash "$RUNNER_TEMP/arhilab-f6-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-f6-baseline/output/Arhilab-Смета-0.7.0-F6-debug.apk" output/upgrade-baseline-f6-debug.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-baseline/output/Arhilab-Смета-0.6.2-debug.apk.signature.txt")
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-f6-baseline/output/Arhilab-Смета-0.7.0-F6-debug.apk.signature.txt")
      - name: Build 0.7.0 stable upgrade baseline with permanent Debug key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          git worktree add --detach "$RUNNER_TEMP/arhilab-070-baseline" 1ec46c65d8f974278eb8125a1bac66b35c55a496
          SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore" bash "$RUNNER_TEMP/arhilab-070-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-070-baseline/output/Arhilab-Смета-0.7.0-F7-debug.apk" output/upgrade-baseline-0.7.0-debug.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-070-baseline/output/Arhilab-Смета-0.7.0-F7-debug.apk.signature.txt")
      - name: Build 0.8.0-alpha2 upgrade baseline with permanent Debug key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          git worktree add --detach "$RUNNER_TEMP/arhilab-alpha2-baseline" cc694da2272e5475c8e737a0e4d7ae11273d4727
          SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore" bash "$RUNNER_TEMP/arhilab-alpha2-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-alpha2-baseline/output/Arhilab-Смета-0.8.0-alpha2-debug.apk" output/upgrade-baseline-alpha2-debug.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-alpha2-baseline/output/Arhilab-Смета-0.8.0-alpha2-debug.apk.signature.txt")
      - name: Build alpha3 upgrade baseline with permanent Debug key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          git worktree add --detach "$RUNNER_TEMP/arhilab-alpha3-baseline" 86f0c1547c90a3829357661e7821dc2b68b4d544
          SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore" bash "$RUNNER_TEMP/arhilab-alpha3-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-alpha3-baseline/output/Arhilab-Смета-0.8.0-alpha3-debug.apk" output/upgrade-baseline-alpha3-debug.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-alpha3-baseline/output/Arhilab-Смета-0.8.0-alpha3-debug.apk.signature.txt")
      - name: Build alpha4 upgrade baseline with permanent Debug key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          git worktree add --detach "$RUNNER_TEMP/arhilab-alpha4-baseline" cd67307727f11042de4d9c9d0ca2e5839e4527f6
          SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore" bash "$RUNNER_TEMP/arhilab-alpha4-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-alpha4-baseline/output/Arhilab-Смета-0.8.0-alpha4-debug.apk" output/upgrade-baseline-alpha4-debug.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-alpha4-baseline/output/Arhilab-Смета-0.8.0-alpha4-debug.apk.signature.txt")
      - name: Build alpha5 upgrade baseline with permanent Debug key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: |
          git worktree add --detach "$RUNNER_TEMP/arhilab-alpha5-baseline" b204c8bcd0065da58868adbd369bce6218a4351e
          SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore" bash "$RUNNER_TEMP/arhilab-alpha5-baseline/arhilab/build.sh" debug
          cp "$RUNNER_TEMP/arhilab-alpha5-baseline/output/Arhilab-Смета-0.8.0-alpha5-debug.apk" output/upgrade-baseline-alpha5-debug.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*debug.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-alpha5-baseline/output/Arhilab-Смета-0.8.0-alpha5-debug.apk.signature.txt")
      - name: Build optional signed Release APK
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.ARHILAB_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ARHILAB_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ARHILAB_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ARHILAB_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" && -z "$SIGNING_STORE_PASSWORD" && -z "$SIGNING_KEY_ALIAS" && -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo 'Release skipped: signing Secrets are not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          : "${KEYSTORE_BASE64:?Incomplete release Secrets}"
          : "${SIGNING_STORE_PASSWORD:?Incomplete release Secrets}"
          export SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-release.p12"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE"
          bash arhilab/build.sh release
          bash "$RUNNER_TEMP/arhilab-baseline/arhilab/build.sh" release
          cp "$RUNNER_TEMP/arhilab-baseline/output/Arhilab-Смета-0.6.2-release.apk" output/upgrade-baseline-0.6.2-release.apk
          bash "$RUNNER_TEMP/arhilab-f6-baseline/arhilab/build.sh" release
          cp "$RUNNER_TEMP/arhilab-f6-baseline/output/Arhilab-Смета-0.7.0-F6-release.apk" output/upgrade-baseline-f6-release.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*release.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-baseline/output/Arhilab-Смета-0.6.2-release.apk.signature.txt")
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*release.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-f6-baseline/output/Arhilab-Смета-0.7.0-F6-release.apk.signature.txt")
          bash "$RUNNER_TEMP/arhilab-070-baseline/arhilab/build.sh" release
          cp "$RUNNER_TEMP/arhilab-070-baseline/output/Arhilab-Смета-0.7.0-F7-release.apk" output/upgrade-baseline-0.7.0-release.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*release.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-070-baseline/output/Arhilab-Смета-0.7.0-F7-release.apk.signature.txt")
          bash "$RUNNER_TEMP/arhilab-alpha2-baseline/arhilab/build.sh" release
          cp "$RUNNER_TEMP/arhilab-alpha2-baseline/output/Arhilab-Смета-0.8.0-alpha2-release.apk" output/upgrade-baseline-alpha2-release.apk
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' output/*release.apk.signature.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' "$RUNNER_TEMP/arhilab-alpha2-baseline/output/Arhilab-Смета-0.8.0-alpha2-release.apk.signature.txt")
          bash arhilab/tests/android/build.sh
          cp arhilab/build/smoke/smoke.apk arhilab/build/smoke/release-smoke.apk
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Build Debug instrumentation test APK
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
        run: SIGNING_KEYSTORE="$RUNNER_TEMP/arhilab-debug.keystore" bash arhilab/tests/android/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator upgrade, offline and smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash arhilab/tests/android/run.sh
      - name: Inspect generated proposal PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdfinfo >/dev/null && command -v pdftotext >/dev/null
          for file in output/pdf-examples/*.pdf; do
            pdfinfo "$file" | grep -q 'Page size:.*960 x 540 pts'
            test "$(pdfinfo "$file" | awk '/^Pages:/{print $2}')" -gt 0
            pdftotext "$file" "${file%.pdf}.txt"
            grep -q 'ARHILAB' "${file%.pdf}.txt"
            grep -q '₽' "${file%.pdf}.txt"
            awk -v RS='\f' 'NF==0{bad=1} END{exit bad}' "${file%.pdf}.txt"
            ! grep -Ei 'закупочн|себестоим|маржа|валовая прибыль|операционная прибыль|worker cost|purchase cost|gross profit|operating profit|margin|internal markup|внутренняя наценка|внутренние коэффициенты' "${file%.pdf}.txt"
          done
          grep -q '5 000 000' output/pdf-examples/arhilab-5-rows.txt
          grep -q 'м²' output/pdf-examples/arhilab-5-rows.txt
          grep -q 'ИТОГО' output/pdf-examples/arhilab-5-rows.txt
          ! grep -q '60 000 000' output/pdf-examples/arhilab-5-rows.txt
          test "$(pdfinfo output/pdf-examples/arhilab-200-rows.pdf | awk '/^Pages:/{print $2}')" -ge 20
      - name: Generated PDFs and preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arhilab-PDF-examples-${{ github.run_number }}
          path: |
            output/pdf-examples/*.pdf
            output/*premium-pdf*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/arhilab-debug.keystore" "$RUNNER_TEMP/arhilab-release.p12"
      - name: Record build provenance
        if: always()
        run: |
          mkdir -p output
          printf 'commit=%s\nrun=%s\nurl=%s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > output/build-provenance.txt
          cat output/Arhilab-Смета-0.8.0-alpha6-*.sha256 2>/dev/null || true
          grep -E 'Verified using v[23] scheme|Signer #1 certificate SHA-256 digest' output/Arhilab-Смета-0.8.0-alpha6-*.signature.txt 2>/dev/null || true
      - name: Downloadable APK
        if: always() && steps.debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: arhilab-0.8.0-alpha6-debug-apk
          path: output/Arhilab-Смета-0.8.0-alpha6-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Downloadable signed Release APK
        if: steps.release.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arhilab-0.8.0-alpha6-release-apk
          path: output/Arhilab-Смета-0.8.0-alpha6-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arhilab-verification-${{ github.run_number }}
          path: |
            output/*.txt
            output/*.sha256
            output/*.png
          if-no-files-found: error
          retention-days: 30
