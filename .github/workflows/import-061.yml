name: Import staged 0.6.1 source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source archive
        run: |
          unzip -o arhilab-061-update.zip
          rm arhilab-061-update.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Arhilab Смета sources to 0.6.1'
          git push origin HEAD:main
